# Installed by powerbutton-guard - https://github.com/kreuzhofer/powerbutton-guard
#
# Hand the power button over to powerbutton-guard.service, which requires a
# deliberate double-press. Without this, logind's built-in default
# (HandlePowerKey=poweroff) powers the machine off on the briefest touch.
#
# HandlePowerKeyLongPress is also ignored on purpose: systemd's long-press
# threshold is a hardcoded 5s, while firmware ACPI override is typically 4s,
# so the firmware usually wins that race and cuts power uncleanly.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
